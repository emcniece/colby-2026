{% include "translation" %}

{% if page.rule.content.size > 0 %}
  <div id="intro" class="intro">
    {{ page.rule.content }}
  </div>
{% endif %}

<dl class="my-4">
  {% for rule in page.rule.rules %}
    <dt>{{ rule.name }}</dt>
    <dd>{{ rule.content }}</dd>
  {% endfor %}
</dl>

{% if page.tags_count > 0 %}
  <div id="page-tags" class="page-tags">
    {% include "page_tags" with page %}
  </div>
{% endif %}

{% include "like_page" %}
