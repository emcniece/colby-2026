  {% endif %}
  
  {{ activity.created_at | time_ago }}

  {% if activity.type_name == 'Comment' and request.logged_in? and site.has_rule_page? and activity.data.has_rule_violation? == nil %}

      <a href="{{ activity.flag_url }}" class="flag get">{{ t_activity_feed_flag }}</a>
    </span>
  {% endif %}
</span>
