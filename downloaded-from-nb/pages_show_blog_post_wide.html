{% include "translation" %}

<div class="row">
  <div class="col-12 col-lg-9 mx-auto">

    <div id="intro" class="intro">
      {{ page.blog_post.content_full }}
    </div>

    {% if page.tags_count > 0 %}
      <div class="page-tags mt-4">
        {% include "page_tags" with page %}
      </div>
    {% endif %}

    {% if page.author.has_bio? %}
      {% include "author_card" %}
    {% endif %}

    {% include "like_page" %}
  </div>
</div>
