{% comment %}
    Display the modal dialog
    
    @param {string} content             - HTML content for the modal dialog
    @param {string} aria_labelledby     - Aria label for the modal
{% endcomment %}

<div id="modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="{{ aria_labelledby }}" aria-hidden="true">
  <div class="container text-right py-3">
    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body">
        {{ content }}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-white btn-sm border text-white mx-auto" data-dismiss="modal"><i class="fas fa-times"></i> {{ t_no_thanks }}</button>
      </div>
    </div>
  </div>
</div>
