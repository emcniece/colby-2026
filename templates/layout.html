<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.headline %}{{ page.headline }} — {% endif %}{{ site.name }}</title>
  <meta name="description" content="{% if page.meta_description %}{{ page.meta_description }}{% else %}Re-Elect Colby Harder for Langford City Council — October 17, 2026{% endif %}" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Lexend:wght@700;800&family=Quattrocento&family=Questrial&display=swap" />

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ 'main.css' | theme_stylesheet_url }}" />

  {% if page.head_content %}{{ page.head_content }}{% endif %}
</head>
<body>

  {{ content_for_layout }}

  <!-- Accordion toggle -->
  <script src="{{ 'accordion.js' | theme_javascript_url }}" defer></script>

  {% if page.foot_content %}{{ page.foot_content }}{% endif %}
</body>
</html>
