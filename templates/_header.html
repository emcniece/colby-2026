<div class="page-top-band">
  <div class="page-top-band__pink">

    <header class="inner-page-header navbar navbar-expand-lg" role="banner">
      <div class="inner-page-header__brand">

        <a href="{{ site.url }}" class="site-header__logo" aria-label="{{ site.name }} — home">
          <img src="{{ theme['colby-logo-sm.png'] }}" alt="{{ site.name }}" class="colby-logo-img" />
        </a>

        <button class="navbar-toggler btn-hamburger" type="button"
                data-toggle="collapse" data-target="#primaryNav"
                aria-controls="primaryNav" aria-expanded="false" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

      </div>

      {% include "nav" %}

    </header>

    {% if page.headline.size > 0 %}
    <section class="page-intro" aria-labelledby="page-headline">
      <div class="page-intro__inner">
        <h1 class="page-intro__headline" id="page-headline">{{ page.headline }}</h1>
        {% if page.excerpt.size > 0 %}
          <p class="page-intro__body">{{ page.excerpt }}</p>
        {% endif %}
      </div>
    </section>
    {% endif %}

  </div>
</div>
