<div class="page-top-band">
  <div class="page-top-band__pink">

    <header class="inner-page-header navbar navbar-expand-lg" role="banner">
      <div class="inner-page-header__brand">

        <a href="{{ site.url }}" class="site-header__logo" aria-label="{{ site.name }} — home">
          <span class="colby-logo colby-logo--v2 colby-logo--default">
            <span class="colby-logo__wordmark">
              <span class="colby-logo__tri colby-logo__tri--left" aria-hidden="true"></span>
              <span class="colby-logo__swatch">
                <span class="colby-logo__name">
                  <span class="colby-logo__colby">COLBY</span>
                  <span class="colby-logo__harder">HARDER</span>
                </span>
              </span>
              <span class="colby-logo__tri colby-logo__tri--right" aria-hidden="true"></span>
            </span>
            <span class="colby-logo__re-elect" aria-hidden="true">
              <span class="colby-logo__re-tri colby-logo__re-tri--left"></span>
              <span class="colby-logo__re-elect-label">
                <span class="colby-logo__re-elect-text">Re-elect</span>
              </span>
              <span class="colby-logo__re-tri colby-logo__re-tri--right"></span>
            </span>
          </span>
        </a>

        <button class="navbar-toggler btn-hamburger" type="button"
                data-toggle="collapse" data-target="#primaryNav"
                aria-controls="primaryNav" aria-expanded="false" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

      </div>

      {% include "nav" %}

    </header>

    {% if page.headline.size > 0 %}
    <section class="page-intro" aria-labelledby="page-headline">
      <div class="page-intro__inner">
        <h1 class="page-intro__headline" id="page-headline">{{ page.headline }}</h1>
        {% if page.excerpt.size > 0 %}
          <p class="page-intro__body">{{ page.excerpt }}</p>
        {% endif %}
      </div>
    </section>
    {% endif %}

  </div>
</div>
